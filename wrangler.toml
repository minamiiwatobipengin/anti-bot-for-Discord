name = "anti-bot-for-discord"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[[ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "CALLBACK_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "VERIFY_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "DELETE_RATE_LIMITER"
namespace_id = "1004"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "ADMIN_RATE_LIMITER"
namespace_id = "1005"
simple = { limit = 2, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "discord-auth-db"
database_id = "1ed5aa10-5ad2-4d19-bc8c-a3ec8d96c23a"

[vars]
DISCORD_CLIENT_ID = "1545763203844149328"
DISCORD_REDIRECT_URI = "https://anti-bot-for-discord.iwatobi.workers.dev/callback"
HCAPTCHA_SITEKEY = "58be8b94-00e8-4844-bf1c-36a8542e548c"

[observability.logs]
enabled = true
invocation_logs = true
